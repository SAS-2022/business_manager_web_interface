<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="business_manager_web_ui">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Web OAuth client ID for google_sign_in_web (client_type 3 in the
       mobile app's android/app/google-services.json — a public identifier,
       not a secret). Without this, google_sign_in_web's plugin init throws
       during app startup on web, before any UI even renders. -->
  <meta name="google-signin-client_id" content="96067619762-dckq5qlc5b1i4gtl1r2ars304seomr13.apps.googleusercontent.com">

  <!-- Google Maps JavaScript API — web-restricted key (HTTP referrer +
       API restrictions to Maps JavaScript API / Geocoding API / Maps
       Static API in Google Cloud Console), separate from mobile's own
       Android/iOS-restricted keys (those use app-identity restrictions
       that don't apply to a browser). Loaded here rather than lazily so
       google.maps.* is available by the time MapViewWidget needs it,
       both for the GoogleMap widget itself and for the client-side
       google.maps.Geocoder used for reverse geocoding (see
       google_geocoder_web.dart) — a web-native replacement for mobile's
       geocoding package (Android/iOS only, no web support) and for the
       Geocoding REST API (blocked by CORS when called directly from a
       browser via http.get()). -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAztLZN9WAJrZiTMvi9PMkmv7JU8VfSiK0" async></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>business_manager_web_ui</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
