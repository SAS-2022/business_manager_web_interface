<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ── SEO ──────────────────────────────────────────────────────────────
       This is a client-rendered Flutter web SPA, not server-rendered HTML —
       everything below (title, meta tags, JSON-LD) is real static markup
       that IS crawlable as-is regardless of renderer, since it lives in
       <head> before Flutter ever boots. The landing page's actual BODY
       content (headline, feature copy, pricing) is a separate question:
       it's only reliably crawlable if Flutter renders to real DOM text
       (the "html" renderer) — if this build uses CanvasKit/Skwasm instead,
       that content paints to a <canvas> and isn't text Google can read, no
       matter how long it waits for JS. Worth deciding deliberately (and
       ideally verifying with Google Search Console's URL inspection tool
       once deployed) rather than assuming either way. -->
  <title>CostEra — All-In-One Business Management Software</title>
  <meta name="description" content="CostEra is the all-in-one workspace for orders, quotes, inventory, purchases, and financial reports — built for retail, manufacturing, and service businesses. Start free.">
  <meta name="keywords" content="business management software, small business software, inventory management, order management, quote management, purchase orders, financial reports, business manager app">
  <meta name="robots" content="index, follow">
  <meta name="author" content="CostEra">
  <link rel="canonical" href="https://costera.biz/">

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CostEra">
  <meta property="og:title" content="CostEra — All-In-One Business Management Software">
  <meta property="og:description" content="Orders, quotes, purchases, inventory, and financial reports — all in one place. Built for retail, manufacturing, and service businesses.">
  <meta property="og:url" content="https://costera.biz/">
  <!-- A real 1200×630 share card (logo, headline, feature chips) — built
       as an HTML page and rendered to PNG via Playwright, not hand-drawn
       or a cropped app icon. Regenerate the same way (see
       marketing_site/README.md) if the branding/copy changes. -->
  <meta property="og:image" content="https://costera.biz/social-preview.png">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CostEra — All-In-One Business Management Software">
  <meta name="twitter:description" content="Orders, quotes, purchases, inventory, and financial reports — all in one place. Built for retail, manufacturing, and service businesses.">
  <meta name="twitter:image" content="https://costera.biz/social-preview.png">

  <!-- JSON-LD structured data — SoftwareApplication, so a rich search
       result can show pricing/category directly. No aggregateRating/review
       fields: fabricating those would violate Google's structured-data
       guidelines (and is simply untrue) — add that block for real once
       CostEra actually has reviews to report. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "CostEra",
    "url": "https://costera.biz/",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "CostEra is the all-in-one workspace for orders, quotes, inventory, purchases, and financial reports — built for retail, manufacturing, and service businesses.",
    "offers": [
      {
        "@type": "Offer",
        "name": "Free",
        "price": "0",
        "priceCurrency": "USD"
      },
      {
        "@type": "Offer",
        "name": "Premium — Monthly",
        "price": "14.99",
        "priceCurrency": "USD"
      },
      {
        "@type": "Offer",
        "name": "Premium — Annual",
        "price": "98.90",
        "priceCurrency": "USD"
      }
    ]
  }
  </script>

  <meta name="theme-color" content="#2E5C82">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CostEra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Web OAuth client ID for google_sign_in_web (client_type 3 in the
       mobile app's android/app/google-services.json — a public identifier,
       not a secret). Without this, google_sign_in_web's plugin init throws
       during app startup on web, before any UI even renders. -->
  <meta name="google-signin-client_id" content="96067619762-dckq5qlc5b1i4gtl1r2ars304seomr13.apps.googleusercontent.com">

  <!-- Google Maps JavaScript API — web-restricted key (HTTP referrer +
       API restrictions to Maps JavaScript API / Geocoding API / Maps
       Static API in Google Cloud Console), separate from mobile's own
       Android/iOS-restricted keys (those use app-identity restrictions
       that don't apply to a browser). Loaded here rather than lazily so
       google.maps.* is available by the time MapViewWidget needs it,
       both for the GoogleMap widget itself and for the client-side
       google.maps.Geocoder used for reverse geocoding (see
       google_geocoder_web.dart) — a web-native replacement for mobile's
       geocoding package (Android/iOS only, no web support) and for the
       Geocoding REST API (blocked by CORS when called directly from a
       browser via http.get()). -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAztLZN9WAJrZiTMvi9PMkmv7JU8VfSiK0" async></script>

  <!-- RevenueCat Web Billing SDK loader removed — the Stripe-backed web
       checkout it powered (revenuecat_web.dart) is on pause; Stripe can't
       be registered from either country the business is tied to right now
       (see subscribe_screen.dart's doc comment). No point loading this
       script on every page for a purchase flow nothing calls anymore. The
       Dart wrapper itself is untouched, so re-adding this script tag is
       the only step needed to bring the Stripe checkout back if that
       changes. -->

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
